# music-du — Cloudflare Worker (personal music app)
# Dashboard names (lowercase, same style as shortener-du / nav-du / ios-loc-du):
#   Worker : music-du
#   D1     : music-du-library
#   Domain : music.dubin.cc
# No KV for this project. Audio is never stored on Cloudflare.

name = "music-du"
main = "server/worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
# Keep workers.dev URL for debugging (music-du.<account-subdomain>.workers.dev)
workers_dev = true
preview_urls = true

[vars]
CHKSZ_API_BASE = "https://api.chksz.top"

[assets]
directory = "./dist/client"
binding = "ASSETS"
run_worker_first = true

# Free D1 library (favorites / playlist / history)
[[d1_databases]]
binding = "MUSIC_DU_DB"
database_name = "music-du-library"
database_id = "7db3d45b-e944-4405-8e6f-ab7ffe25929f"
migrations_dir = "migrations"

# Zone route for music.dubin.cc (DNS CNAME managed separately / already on zone)
# Pattern uses /* for path match; script name is music-du
[[routes]]
pattern = "music.dubin.cc/*"
zone_name = "dubin.cc"

# Free tier only: Cache API for covers/meta; no R2/paid KV; no audio proxy body.
# Secrets via dashboard or wrangler secret put. Deploy: npm run build && npx wrangler deploy
