# music-du — Cloudflare Worker
#
# Fork checklist:
#   1. Change `name` / D1 `database_name`
#   2. Run `npm run setup:d1` and paste your database_id below
#   3. `npx wrangler secret put` for gateway keys + MUSIC_ACCESS_TOKEN
#   4. Bind custom domains in the Cloudflare dashboard
#
# Free tier: no R2 / paid KV. Audio is never stored on Cloudflare (302 to CDN).

name = "music-du"
main = "server/worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
# Prefer custom hostnames behind Access; enable workers_dev for quick tests
workers_dev = false
preview_urls = false

[observability]
enabled = true
head_sampling_rate = 1

[vars]
CHKSZ_API_BASE = "https://api.chksz.top"
CHKSZ_FALLBACK_BASE = "https://api.chksz.com"
# Fail closed if MUSIC_ACCESS_TOKEN secret missing on these hosts (comma-separated).
# Forks: set your own domain or leave empty.
LIBRARY_TOKEN_REQUIRED_HOSTS = "music.dubin.cc,music.dubin.one,music.dubin.vip,dubin.cc,dubin.one,dubin.vip"

[assets]
directory = "./dist/client"
binding = "ASSETS"
run_worker_first = true

# Free D1 — replace database_id after `npm run setup:d1` / `wrangler d1 create`
[[d1_databases]]
binding = "MUSIC_DU_DB"
database_name = "music-du-library"
database_id = "7db3d45b-e944-4405-8e6f-ab7ffe25929f"
migrations_dir = "migrations"

# ── Optional public demo (read-only library) ────────────────────────────────
# Deploy: npm run deploy:cf:demo
# Bind a separate hostname; do NOT put it behind private Access.
# Secrets: gateway keys only (no MUSIC_ACCESS_TOKEN). Same or separate D1.
[env.demo]
name = "music-du-demo"
workers_dev = true
preview_urls = false

[env.demo.observability]
enabled = true
head_sampling_rate = 1

[env.demo.vars]
CHKSZ_API_BASE = "https://api.chksz.top"
CHKSZ_FALLBACK_BASE = "https://api.chksz.com"
LIBRARY_READONLY = "true"

[env.demo.assets]
directory = "./dist/client"
binding = "ASSETS"
run_worker_first = true

[[env.demo.d1_databases]]
binding = "MUSIC_DU_DB"
database_name = "music-du-library"
database_id = "7db3d45b-e944-4405-8e6f-ab7ffe25929f"
migrations_dir = "migrations"
