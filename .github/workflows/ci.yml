name: CI

# Same pattern as sub-du / ios-loc-du:
#   secrets: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
#   wrangler-action@v3 → deploy

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: music-du-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Production deploy: only the upstream repo (forks run `test` only).
  # Set GitHub secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, MUSIC_ACCESS_TOKEN,
  # optional CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET for Access-gated smoke.
  deploy:
    needs: test
    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.repository == 'sonnemusk/music-du'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build client + server
        env:
          VITE_MUSIC_ACCESS_TOKEN: ${{ secrets.MUSIC_ACCESS_TOKEN }}
        run: npm run build
      - name: Deploy primary Worker (music-du)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Smoke primary
        env:
          # Override with repo secret SMOKE_BASE if set
          SMOKE_BASE: ${{ secrets.SMOKE_BASE }}
          MUSIC_ACCESS_TOKEN: ${{ secrets.MUSIC_ACCESS_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          export SMOKE_BASE="${SMOKE_BASE:-https://music.dubin.cc}"
          bash scripts/smoke-prod.sh
      - name: Build SPA without library token (demo)
        env:
          VITE_MUSIC_ACCESS_TOKEN: ""
        run: npm run build
      - name: Deploy demo Worker (music-du-demo, read-only)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env demo
      - name: Smoke demo (public read-only)
        env:
          SMOKE_BASE: ${{ secrets.SMOKE_DEMO_BASE }}
          SMOKE_DEMO: "1"
        run: |
          export SMOKE_BASE="${SMOKE_BASE:-https://music.du.dev}"
          bash scripts/smoke-prod.sh
