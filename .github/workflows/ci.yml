name: CI

# Same pattern as sub-du / ios-loc-du:
#   secrets: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
#   wrangler-action@v3 → deploy

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: music-du-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # SPA assets must exist under dist/client before wrangler upload
      - name: Build client + server
        env:
          # baked into SPA for library X-Music-Token (same value as Worker secret)
          VITE_MUSIC_ACCESS_TOKEN: ${{ secrets.MUSIC_ACCESS_TOKEN }}
        run: npm run build
      - name: Deploy private Worker (music-du)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Smoke private production after deploy
        env:
          SMOKE_BASE: https://music.dubin.cc
          MUSIC_ACCESS_TOKEN: ${{ secrets.MUSIC_ACCESS_TOKEN }}
          # Cloudflare Access service token (free Zero Trust) — bypasses login for CI
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: bash scripts/smoke-prod.sh
      # Demo SPA must NOT bake MUSIC_ACCESS_TOKEN (public site)
      - name: Build SPA without library token (demo)
        env:
          VITE_MUSIC_ACCESS_TOKEN: ""
        run: npm run build
      - name: Deploy demo Worker (music-du-demo, read-only)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env demo
      - name: Smoke demo (public read-only)
        env:
          # Custom domain (preferred); workers.dev is fallback if DNS not ready
          SMOKE_BASE: https://music.du.dev
          SMOKE_DEMO: "1"
        run: bash scripts/smoke-prod.sh
